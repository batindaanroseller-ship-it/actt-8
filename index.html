<!DOCTYPE html>
<html>
<head>
    <title>Activity 8</title>

    <style>
        body {
            background-color: #0d0d0d;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 100px;
        }

        h2 {
            color: #ff1a1a;
        }

        button {
            background-color: #ff1a1a;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: black;
            border: 1px solid #ff1a1a;
        }
    </style>

    <script>
        function myFunction() {
            var name = "Rose";
            alert("Hi " + name + " I am an alert box!");
        }
    </script>
</head>

<body>

    <h2>JavaScript Alert</h2>
    <button onclick="myFunction()">Click here!</button>

</body>
</html>
